services:
  ipad1-legacy-gateway:
    build: .
    container_name: ipad1-legacy-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8091}:8091"
    environment:
      GATEWAY_TOKEN: "${GATEWAY_TOKEN}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-bidanismanlik.com,www.bidanismanlik.com}"
      LITE_MODE: "${LITE_MODE:-1}"
      MAX_RESPONSE_MB: "${MAX_RESPONSE_MB:-15}"
